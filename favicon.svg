<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Background matching site dark -->
  <rect width="32" height="32" rx="6" fill="#0a0a0f"/>
  <!-- A mark: two legs + diagonal slash — exact geometry from logo-3b, scaled to fit 24x24 in 32x32 -->
  <g stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left leg: left foot → apex -->
    <line x1="4.5"  y1="28"   x2="15"   y2="4"/>
    <!-- Right leg: right foot → apex -->
    <line x1="25.5" y1="28"   x2="15"   y2="4"/>
    <!-- Diagonal slash: left foot → past right leg (the crossbar that isn't horizontal) -->
    <line x1="4.5"  y1="28"   x2="27.5" y2="16.5"/>
  </g>
</svg>
