<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0f172a"/>

  <!-- Subtle grid hint — two hairlines at crossbar height + center vertical -->
  <line x1="4"  y1="16.3" x2="28" y2="16.3" stroke="#4ade80" stroke-width="0.35" opacity="0.22"/>
  <line x1="16" y1="4"    x2="16" y2="28"   stroke="#4ade80" stroke-width="0.35" opacity="0.12"/>

  <!-- Outer A skeleton (dim guide lines, matching original #334155 tone) -->
  <line x1="6.2"  y1="29.7" x2="15.8" y2="2.7"  stroke="#334155" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="25.8" y1="29.7" x2="16.2" y2="2.7"  stroke="#334155" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Green lower legs of the A (lit portion, bottom→crossbar) -->
  <line x1="6.2"  y1="29.7" x2="10.3" y2="16.3" stroke="#4ade80" stroke-width="1.9" stroke-linecap="round"/>
  <line x1="25.8" y1="29.7" x2="21.7" y2="16.3" stroke="#4ade80" stroke-width="1.9" stroke-linecap="round"/>

  <!-- Green crossbar -->
  <line x1="10.3" y1="16.3" x2="21.7" y2="16.3" stroke="#4ade80" stroke-width="1.9" stroke-linecap="round"/>

  <!-- Dark upper legs (crossbar→apex, matches original skeleton treatment) -->
  <line x1="10.3" y1="16.3" x2="15.8" y2="2.7"  stroke="#334155" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="21.7" y1="16.3" x2="16.2" y2="2.7"  stroke="#334155" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="16"   cy="2.8"  r="2.2" fill="#4ade80"/>
  <circle cx="10.3" cy="16.3" r="1.6" fill="#4ade80" opacity="0.88"/>
  <circle cx="21.7" cy="16.3" r="1.6" fill="#4ade80" opacity="0.88"/>
  <circle cx="6.2"  cy="29.7" r="1.2" fill="#64748b"/>
  <circle cx="25.8" cy="29.7" r="1.2" fill="#64748b"/>
</svg>
