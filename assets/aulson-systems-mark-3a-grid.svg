  <circle cx="15"  cy="86"  r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="40"  cy="86"  r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="60"  cy="86"  r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="80"  cy="86"  r="1.5" fill="#4ade80" opacity="0.2"/>
