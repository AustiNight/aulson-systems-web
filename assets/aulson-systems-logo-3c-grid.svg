<svg width="340" height="200" viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="340" height="200" fill="#0f172a"/>
  <!-- Grid lines -->
  <g opacity="0.18" stroke="#4ade80" stroke-width="0.75" fill="none">
    <line x1="60" y1="20" x2="60" y2="185"/>
    <line x1="95" y1="20" x2="95" y2="185"/>
    <line x1="130" y1="20" x2="130" y2="185"/>
    <line x1="165" y1="20" x2="165" y2="185"/>
    <line x1="200" y1="20" x2="200" y2="185"/>
    <line x1="60" y1="20"  x2="200" y2="20"/>
    <line x1="60" y1="55"  x2="200" y2="55"/>
    <line x1="60" y1="90"  x2="200" y2="90"/>
    <line x1="60" y1="125" x2="200" y2="125"/>
    <line x1="60" y1="160" x2="200" y2="160"/>
    <line x1="60" y1="185" x2="200" y2="185"/>
  </g>
  <!-- Ghost grid intersection dots -->
  <circle cx="60"  cy="55"  r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="95"  cy="55"  r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="165" cy="55"  r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="200" cy="55"  r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="60"  cy="90"  r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="95"  cy="90"  r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="130" cy="90"  r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="165" cy="90"  r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="200" cy="90"  r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="60"  cy="125" r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="95"  cy="125" r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="130" cy="125" r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="165" cy="125" r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="200" cy="125" r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="60"  cy="160" r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="95"  cy="160" r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="130" cy="160" r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="165" cy="160" r="1.5" fill="#4ade80" opacity="0.2"/>
  <circle cx="200" cy="160" r="1.5" fill="#4ade80" opacity="0.2"/>
  <!-- A skeleton: apex at y=55 (one square lower than before), base at y=185, crossbar at y=125 -->
  <line x1="73"  y1="185" x2="130" y2="55"  stroke="#334155" stroke-width="1.5"/>
  <line x1="187" y1="185" x2="130" y2="55"  stroke="#334155" stroke-width="1.5"/>
  <line x1="73"  y1="185" x2="187" y2="185" stroke="#334155" stroke-width="1.5"/>
  <line x1="73"  y1="185" x2="92"  y2="125" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="187" y1="185" x2="168" y2="125" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="92"  y1="125" x2="168" y2="125" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="92"  y1="125" x2="130" y2="55"  stroke="#334155" stroke-width="1.5"/>
  <line x1="168" y1="125" x2="130" y2="55"  stroke="#334155" stroke-width="1.5"/>
  <!-- Nodes -->
  <circle cx="130" cy="55"  r="5"   fill="#4ade80"/>
  <circle cx="92"  cy="125" r="4"   fill="#4ade80" opacity="0.85"/>
  <circle cx="168" cy="125" r="4"   fill="#4ade80" opacity="0.85"/>
  <circle cx="73"  cy="185" r="3"   fill="#64748b"/>
  <circle cx="187" cy="185" r="3"   fill="#64748b"/>
  <!-- Text inside lower triangle -->
  <text x="130" y="158" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="20" font-weight="500" fill="#f8fafc">Aulson</text>
  <text x="130" y="174" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="8" font-weight="400" fill="#64748b" letter-spacing="2.5">SYSTEMS</text>
  <!-- Wordmark -->
  <text x="218" y="112" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="28" font-weight="500" fill="#f8fafc">Aulson</text>
  <text x="220" y="132" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b" letter-spacing="2.5">SYSTEMS</text>
</svg>
