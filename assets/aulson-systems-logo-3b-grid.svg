<svg width="340" height="200" viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid background matching site -->
  <rect width="340" height="200" fill="#0a0a0f"/>

  <!-- A mark: inverted V + diagonal slash from left foot through right leg crossbar, extending past -->
  <g stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left leg: left foot to peak -->
    <line x1="75" y1="170" x2="130" y2="45"/>
    <!-- Right leg: right foot to peak -->
    <line x1="185" y1="170" x2="130" y2="45"/>
    <!-- Diagonal slash: from left foot, up-right through the right leg at crossbar height, extending past -->
    <line x1="75" y1="170" x2="195" y2="110"/>
  </g>

  <!-- Wordmark -->
  <text x="218" y="112" font-family="'Inter', 'IBM Plex Sans', system-ui, sans-serif" font-size="28" font-weight="500" fill="#f8fafc">Aulson</text>
  <text x="220" y="132" font-family="'Inter', 'IBM Plex Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b" letter-spacing="2.5">SYSTEMS</text>
</svg>
